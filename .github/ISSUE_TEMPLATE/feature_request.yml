name: Feature request
description: Propose an ERP template or component improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: ERP problem or workflow
      description: Explain the user need rather than only the desired UI.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed template or component
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
